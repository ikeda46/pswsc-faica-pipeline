[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pswsc-faica-pipeline"
version = "0.1.0"
description = "FA+ICA-based extraction of calibrated, error-barred spectra from DESHIMA/ASTE position-switching observations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "xarray",
]

[tool.setuptools.packages.find]
where = ["src"]
